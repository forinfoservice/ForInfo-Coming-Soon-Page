<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>ForInfo – Coming Soon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #0a1929 0%, #132f4c 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      color: #e8f4f8;
    }

    .container {
      max-width: 900px;
      width: 100%;
      text-align: center;
    }

    .content {
      margin-bottom: 3rem;
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(120deg, #ffffff, #90caf9);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      tracking: -0.02em;
    }

    h1 {
      font-size: 4rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .description {
      font-size: 1.25rem;
      line-height: 1.6;
      margin-bottom: 2.5rem;
      opacity: 0.85;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      font-weight: 300;
      color: #b0bec5;
    }

    .tagline {
      font-size: 1rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
      opacity: 0.75;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #64b5f6;
    }

    .cta-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .cta-button {
      background: linear-gradient(135deg, #2196f3, #1976d2);
      border: none;
      padding: 1.1rem 3rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1.05rem;
      color: #ffffff;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(33, 150, 243, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(33, 150, 243, 0.4);
      background: linear-gradient(135deg, #42a5f5, #1e88e5);
    }

    .cta-button:active {
      transform: translateY(0);
      box-shadow: 0 5px 15px rgba(33, 150, 243, 0.3);
    }

    .status {
      font-size: 0.95rem;
      font-weight: 500;
      opacity: 0.7;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #81c784;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2.8rem;
      }

      .logo {
        font-size: 1.8rem;
      }

      .description {
        font-size: 1.1rem;
        margin-bottom: 2rem;
      }

      .cta-button {
        padding: 1rem 2.5rem;
        font-size: 1rem;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 1.5rem;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 1rem;
      }

      .logo {
        font-size: 1.5rem;
        margin-bottom: 1rem;
      }

      .description {
        font-size: 1rem;
        margin-bottom: 1.5rem;
      }

      .cta-button {
        padding: 0.95rem 2rem;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="content">
    <div class="logo">ForInfo</div>
    <div class="tagline">Intelligent Information, Simplified</div>

    <h1>Something Great is Coming</h1>
    <div class="description">
      We're building a smarter way to access, organize, and benefit from information. 
      A platform designed for clarity, speed, and trust. Launching soon.
    </div>
  </div>

  <div class="cta-container">
    <button class="cta-button">Get Early Access</button>
    <div class="status">🔄 In Development</div>
  </div>
</div>
</body>
</html>
